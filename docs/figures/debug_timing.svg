="306" y1="480" x2="306" y2="628" stroke="#ddd" stroke-dasharray="2,3"/><line x1="382" y1="480" x2="382" y2="628" stroke="#ddd" stroke-dasharray="2,3"/><line x1="458" y1="480" x2="458" y2="628" stroke="#ddd" stroke-dasharray="2,3"/><line x1="534" y1="480" x2="534" y2="628" stroke="#ddd" stroke-dasharray="2,3"/><line x1="610" y1="480" x2="610" y2="628" stroke="#ddd" stroke-dasharray="2,3"/><line x1="686" y1="480" x2="686" y2="628" stroke="#ddd" stroke-dasharray="2,3"/><line x1="762" y1="480" x2="762" y2="628" stroke="#ddd" stroke-dasharray="2,3"/><line x1="838" y1="480" x2="838" y2="628" stroke="#ddd" stroke-dasharray="2,3"/><text x="60" y="655" font-size="10" text-anchor="start" font-weight="normal" fill="#333" font-family="Helvetica,Arial,sans-serif">Pins change at most once per 2 clocks (33 MHz). The opcode is sampled at edge k and executes at edge k+1. The core holds the frozen byte for 2 edges,</text><text x="60" y="671" font-size="10" text-anchor="start" font-weight="normal" fill="#333" font-family="Helvetica,Arial,sans-serif">so exactly one output tick (green) loads it into uo_out. Reading uo_out after edge k+3 always returns the byte. Space debug reads one beat apart.</text><text x="60" y="24" font-size="13" text-anchor="start" font-weight="bold" fill="#333" font-family="Helvetica,Arial,sans-serif">A debug opcode returns one byte, held on the pins for one beat (2 clocks)</text></svg>