text x="258" y="420" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#888" font-family="Helvetica,Arial,sans-serif">edge k</text><text x="356" y="420" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#888" font-family="Helvetica,Arial,sans-serif">edge k+1</text><text x="454" y="420" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#888" font-family="Helvetica,Arial,sans-serif">edge k+2</text><text x="552" y="420" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#888" font-family="Helvetica,Arial,sans-serif">edge k+3</text><text x="650" y="420" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#888" font-family="Helvetica,Arial,sans-serif">edge k+4</text><text x="748" y="420" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#888" font-family="Helvetica,Arial,sans-serif">edge k+5</text><text x="148" y="444" font-size="10" text-anchor="end" font-weight="normal" fill="#333" font-family="Helvetica,Arial,sans-serif">clk</text><path d="M130,450 L160,450 L160,434 L209.0,434 L209.0,450 L258,450 L258,434 L307.0,434 L307.0,450 L356,450 L356,434 L405.0,434 L405.0,450 L454,450 L454,434 L503.0,434 L503.0,450 L552,450 L552,434 L601.0,434 L601.0,450 L650,450 L650,434 L699.0,434 L699.0,450 L748,450 L748,434 L797.0,434 L797.0,450" fill="none" stroke="#777" stroke-width="1"/><text x="148" y="478" font-size="10" text-anchor="end" font-weight="normal" fill="#333" font-family="Helvetica,Arial,sans-serif">uio_in</text><path d="M166,475 L172,465 L252,465 L258,475 L252,485 L172,485 z" fill="#dbe8f7" stroke="#4a7fc1"/><text x="212.0" y="479" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#333" font-family="Helvetica,Arial,sans-serif">byte 0</text><path d="M264,475 L270,465 L350,465 L356,475 L350,485 L270,485 z" fill="#dbe8f7" stroke="#4a7fc1"/><text x="310.0" y="479" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#333" font-family="Helvetica,Arial,sans-serif">byte 1</text><path d="M362,475 L368,465 L448,465 L454,475 L448,485 L368,485 z" fill="#dbe8f7" stroke="#4a7fc1"/><text x="408.0" y="479" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#333" font-family="Helvetica,Arial,sans-serif">byte 2</text><path d="M460,475 L466,465 L840,465 L846,475 L840,485 L466,485 z" fill="#fff" stroke="#999"/><text x="653.0" y="479" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#333" font-family="Helvetica,Arial,sans-serif">NOP</text><text x="148" y="508" font-size="10" text-anchor="end" font-weight="normal" fill="#333" font-family="Helvetica,Arial,sans-serif">core</text><path d="M362,505 L368,495 L448,495 L454,505 L448,515 L368,515 z" fill="#e9e9e9" stroke="#999"/><text x="408.0" y="509" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#333" font-family="Helvetica,Arial,sans-serif">exec 0</text><path d="M460,505 L466,495 L546,495 L552,505 L546,515 L466,515 z" fill="#e9e9e9" stroke="#999"/><text x="506.0" y="509" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#333" font-family="Helvetica,Arial,sans-serif">exec 1</text><path d="M558,505 L564,495 L644,495 L650,505 L644,515 L564,515 z" fill="#e9e9e9" stroke="#999"/><text x="604.0" y="509" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#333" font-family="Helvetica,Arial,sans-serif">exec 2</text><text x="148" y="538" font-size="10" text-anchor="end" font-weight="normal" fill="#333" font-family="Helvetica,Arial,sans-serif">uo_out</text><path d="M166,535 L172,525 L448,525 L454,535 L448,545 L172,545 z" fill="#fff" stroke="#999"/><text x="310.0" y="539" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#333" font-family="Helvetica,Arial,sans-serif">live</text><path d="M460,535 L466,525 L546,525 L552,535 L546,545 L466,545 z" fill="#dbe8f7" stroke="#4a7fc1"/><text x="506.0" y="539" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#333" font-family="Helvetica,Arial,sans-serif">sum[7:0]</text><path d="M558,535 L564,525 L644,525 L650,535 L644,545 L564,545 z" fill="#dbe8f7" stroke="#4a7fc1"/><text x="604.0" y="539" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#333" font-family="Helvetica,Arial,sans-serif">sum[15:8]</text><path d="M656,535 L662,525 L742,525 L748,535 L742,545 L662,545 z" fill="#dbe8f7" stroke="#4a7fc1"/><text x="702.0" y="539" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#333" font-family="Helvetica,Arial,sans-serif">sum[23:16]</text><path d="M754,535 L760,525 L840,525 L846,535 L840,545 L760,545 z" fill="#fff" stroke="#999"/><text x="800.0" y="539" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#333" font-family="Helvetica,Arial,sans-serif">live</text><text x="60" y="572" font-size="10" text-anchor="start" font-weight="normal" fill="#555" font-family="Helvetica,Arial,sans-serif">The opcode is on the pins before edge k and sampled into the input register at edge k; the core executes it at edge k+1; the output register</text><text x="60" y="587" font-size="10" text-anchor="start" font-weight="normal" fill="#555" font-family="Helvetica,Arial,sans-serif">loads the byte at edge k+2, so it is on uo_out from edge k+2 to edge k+3. DEBUG_ADD never returns bits [23:8]; for the full sum,</text><text x="60" y="602" font-size="10" text-anchor="start" font-weight="normal" fill="#555" font-family="Helvetica,Arial,sans-serif">let the RUN finish and use three DEBUG_PARTIAL_SUM reads.</text></svg>