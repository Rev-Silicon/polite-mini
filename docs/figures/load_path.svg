<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560">
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4 L0,8 z" fill="#888"/></marker></defs>
<rect width="900" height="560" fill="#fff"/>
<text x="30" y="28" font-size="13" font-weight="bold" fill="#222" font-family="Helvetica,Arial,sans-serif">Operands: LOAD writes ui_in to the input buffer; RUN takes ui_in live from the bus</text>
<rect x="20" y="50" width="170" height="250" rx="10" fill="#efefef" stroke="#ccc"/>
<text x="105" y="80" font-size="14" text-anchor="middle" font-weight="bold" fill="#222" font-family="Helvetica,Arial,sans-serif">Host</text>
<text x="105" y="98" font-size="11" text-anchor="middle" fill="#666" font-family="Helvetica,Arial,sans-serif">ui_in[7:0], one byte</text>
<text x="105" y="114" font-size="11" text-anchor="middle" fill="#666" font-family="Helvetica,Arial,sans-serif">per LOAD or RUN</text>
<rect x="45" y="140" width="120" height="40" fill="#fff" stroke="#888"/><line x1="105" y1="140" x2="105" y2="180" stroke="#888"/>
<text x="75" y="158" font-size="11" text-anchor="middle" font-weight="bold" fill="#222" font-family="Helvetica,Arial,sans-serif">[7:4]</text><text x="75" y="173" font-size="10" text-anchor="middle" fill="#333" font-family="Helvetica,Arial,sans-serif">high</text>
<text x="135" y="158" font-size="11" text-anchor="middle" font-weight="bold" fill="#222" font-family="Helvetica,Arial,sans-serif">[3:0]</text><text x="135" y="173" font-size="10" text-anchor="middle" fill="#333" font-family="Helvetica,Arial,sans-serif">low</text>
<text x="105" y="210" font-size="10.5" text-anchor="middle" fill="#333" font-family="Helvetica,Arial,sans-serif">[7:4] = lane 1 → row/col 2</text>
<text x="105" y="235" font-size="10.5" text-anchor="middle" fill="#333" font-family="Helvetica,Arial,sans-serif">[3:0] = lane 0 → row/col 1</text>
<rect x="215" y="50" width="665" height="400" rx="10" fill="#e6f0fb" stroke="#4a7fc1" stroke-width="1.5"/>
<text x="860" y="74" font-size="14" text-anchor="end" font-weight="bold" fill="#222" font-family="Helvetica,Arial,sans-serif">POLITE V(−1)</text>
<line x1="192" y1="160" x2="268" y2="160" stroke="#888" stroke-width="2" marker-end="url(#a)"/>
<text x="230" y="152" font-size="10" text-anchor="middle" fill="#333" font-family="Helvetica,Arial,sans-serif">byte</text>
<rect x="270" y="115" width="140" height="95" fill="#fff" stroke="#4a7fc1"/>
<text x="340" y="133" font-size="12" text-anchor="middle" font-weight="bold" fill="#222" font-family="Helvetica,Arial,sans-serif">Bus byte (ui_in with RUN)</text>
<text x="340" y="153" font-size="10.5" text-anchor="middle" fill="#333" font-family="Helvetica,Arial,sans-serif">bus[2] = [7:4]</text>
<text x="340" y="170" font-size="10.5" text-anchor="middle" fill="#333" font-family="Helvetica,Arial,sans-serif">bus[1] = [3:0]</text>
<text x="340" y="196" font-size="9.5" text-anchor="middle" fill="#555" font-family="Helvetica,Arial,sans-serif"></text>
<rect x="270" y="270" width="140" height="95" fill="#fff" stroke="#4a7fc1"/>
<text x="340" y="288" font-size="12" text-anchor="middle" font-weight="bold" fill="#222" font-family="Helvetica,Arial,sans-serif">Input buffer (LOAD)</text>
<text x="340" y="308" font-size="10.5" text-anchor="middle" fill="#333" font-family="Helvetica,Arial,sans-serif">buf[2] = [7:4]</text>
<text x="340" y="325" font-size="10.5" text-anchor="middle" fill="#333" font-family="Helvetica,Arial,sans-serif">buf[1] = [3:0]</text>
<text x="340" y="351" font-size="9.5" text-anchor="middle" fill="#555" font-family="Helvetica,Arial,sans-serif"></text>
<line x1="320" y1="268" x2="320" y2="212" stroke="#888" stroke-width="2" marker-end="url(#a)"/>
<line x1="360" y1="212" x2="360" y2="268" stroke="#888" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#a)"/>
<text x="232" y="236" font-size="9.5" fill="#333" font-family="Helvetica,Arial,sans-serif"></text>
<text x="366" y="236" font-size="9.5" fill="#333" font-family="Helvetica,Arial,sans-serif"></text>
<text x="340" y="390" font-size="10" text-anchor="middle" fill="#333" font-family="Helvetica,Arial,sans-serif"></text>
<text x="340" y="405" font-size="10" text-anchor="middle" fill="#333" font-family="Helvetica,Arial,sans-serif"></text>
<text x="340" y="420" font-size="10" text-anchor="middle" fill="#333" font-family="Helvetica,Arial,sans-serif"></text>
<g font-size="11" text-anchor="middle" fill="#222" font-family="Helvetica,Arial,sans-serif">
<rect x="560" y="200" width="110" height="70" fill="#fff" stroke="#4a7fc1"/><text x="615" y="230" font-weight="bold">PE(1,1)</text><text x="615" y="248" font-size="10">buf[1]×bus[1]</text>
<rect x="710" y="200" width="110" height="70" fill="#fff" stroke="#4a7fc1"/><text x="765" y="230" font-weight="bold">PE(1,2)</text><text x="765" y="248" font-size="10">buf[1]×bus[2]</text>
<rect x="560" y="300" width="110" height="70" fill="#fff" stroke="#4a7fc1"/><text x="615" y="330" font-weight="bold">PE(2,1)</text><text x="615" y="348" font-size="10">buf[2]×bus[1]</text>
<rect x="710" y="300" width="110" height="70" fill="#fff" stroke="#4a7fc1"/><text x="765" y="330" font-weight="bold">PE(2,2)</text><text x="765" y="348" font-size="10">buf[2]×bus[2]</text>
</g>
<text x="690" y="100" font-size="12" text-anchor="middle" font-weight="bold" fill="#222" font-family="Helvetica,Arial,sans-serif">2×2 array: PE(i,j) += buf[i] × bus[j]</text>
<polyline points="412,140 615,140 615,198" fill="none" stroke="#888" stroke-width="2" marker-end="url(#a)"/>
<polyline points="412,140 765,140 765,198" fill="none" stroke="#888" stroke-width="2" marker-end="url(#a)"/>
<text x="615" y="132" font-size="10" text-anchor="middle" fill="#333" font-family="Helvetica,Arial,sans-serif">bus[1] (low)</text>
<text x="765" y="132" font-size="10" text-anchor="middle" fill="#333" font-family="Helvetica,Arial,sans-serif">bus[2] (high)</text>
<line x1="440" y1="235" x2="558" y2="235" stroke="#888" stroke-width="2" marker-end="url(#a)"/>
<line x1="412" y1="335" x2="558" y2="335" stroke="#888" stroke-width="2" marker-end="url(#a)"/>
<line x1="412" y1="300" x2="440" y2="300" stroke="#888" stroke-width="2"/><line x1="440" y1="300" x2="440" y2="235" stroke="#888" stroke-width="2"/>
<text x="490" y="228" font-size="10" text-anchor="middle" fill="#333" font-family="Helvetica,Arial,sans-serif">buf[1] (low)</text>
<text x="490" y="328" font-size="10" text-anchor="middle" fill="#333" font-family="Helvetica,Arial,sans-serif">buf[2] (high)</text>
<rect x="560" y="395" width="260" height="40" fill="#fff" stroke="#4a7fc1"/>
<text x="690" y="412" font-size="11" text-anchor="middle" font-weight="bold" fill="#222" font-family="Helvetica,Arial,sans-serif">Output buffer</text>
<text x="690" y="427" font-size="9.5" text-anchor="middle" fill="#333" font-family="Helvetica,Arial,sans-serif">DUMP_LOAD snapshots all 4 partial sums</text>
<!-- every PE jumps onto the trunk into the output buffer -->
<line x1="690" y1="285" x2="690" y2="393" stroke="#888" stroke-width="2" marker-end="url(#a)"/>
<polyline points="615,270 615,285 690,285" fill="none" stroke="#888" stroke-width="2" marker-end="url(#a)"/>
<polyline points="765,270 765,285 690,285" fill="none" stroke="#888" stroke-width="2" marker-end="url(#a)"/>
<line x1="670" y1="340" x2="688" y2="340" stroke="#888" stroke-width="2" marker-end="url(#a)"/>
<line x1="710" y1="340" x2="692" y2="340" stroke="#888" stroke-width="2" marker-end="url(#a)"/>
<circle cx="690" cy="285" r="3" fill="#888"/>
<text x="828" y="388" font-size="9.5" text-anchor="end" fill="#333" font-family="Helvetica,Arial,sans-serif">all 4 partial sums</text>
<line x1="690" y1="437" x2="690" y2="478" stroke="#888" stroke-width="2" marker-end="url(#a)"/>
<text x="700" y="465" font-size="10.5" fill="#333" font-family="Helvetica,Arial,sans-serif">uo_out[3:0]: 24-nibble stream to host</text>
<rect x="20" y="485" width="860" height="60" rx="6" fill="#fff6e5" stroke="#d9a441"/>
<text x="35" y="508" font-size="12" font-weight="bold" fill="#222" font-family="Helvetica,Arial,sans-serif">Daisy-chain dump removed.</text>
<text x="35" y="528" font-size="11" fill="#333" font-family="Helvetica,Arial,sans-serif">Results never shift out through the processing elements. All four PEs feed the output buffer; DUMP_LOAD snapshots them and streams uo_out[3:0].</text>
</svg>
