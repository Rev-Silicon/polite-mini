<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430"><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4 L0,8 z" fill="#888"/></marker></defs><rect width="900" height="430" fill="#fff"/><text x="60" y="28" font-size="13" text-anchor="start" font-weight="bold" fill="#222" font-family="Helvetica,Arial,sans-serif">The host drives 16 input bits every rising edge; the chip returns one byte per edge</text><rect x="40" y="55" width="190" height="340" rx="10" fill="#efefef" stroke="#ccc"/><text x="135" y="215" font-size="14" text-anchor="middle" font-weight="bold" fill="#222" font-family="Helvetica,Arial,sans-serif">Host</text><text x="135" y="233" font-size="10" text-anchor="middle" font-weight="normal" fill="#666" font-family="Helvetica,Arial,sans-serif">board / test controller</text><rect x="670" y="55" width="190" height="340" rx="10" fill="#e6f0fb" stroke="#4a7fc1" stroke-width="1.5"/><text x="765" y="215" font-size="14" text-anchor="middle" font-weight="bold" fill="#222" font-family="Helvetica,Arial,sans-serif">POLITE V(−1)</text><text x="765" y="233" font-size="10" text-anchor="middle" font-weight="normal" fill="#4a7fc1" font-family="Helvetica,Arial,sans-serif">tt_um_polite_vneg1</text><line x1="232" y1="85" x2="668" y2="85" stroke="#888" stroke-width="2" marker-end="url(#a)"/><text x="250" y="79" font-size="10.5" text-anchor="start" font-weight="normal" fill="#333" font-family="Helvetica,Arial,sans-serif">clk (single rising edge; target 66 MHz)</text><line x1="232" y1="120" x2="668" y2="120" stroke="#888" stroke-width="2" marker-end="url(#a)"/><text x="250" y="114" font-size="10.5" text-anchor="start" font-weight="normal" fill="#333" font-family="Helvetica,Arial,sans-serif">rst_n (active low: all state 0, input registers hold NOP)</text><line x1="232" y1="155" x2="668" y2="155" stroke="#888" stroke-width="2" marker-end="url(#a)"/><text x="250" y="149" font-size="10.5" text-anchor="start" font-weight="normal" fill="#333" font-family="Helvetica,Arial,sans-serif">ena (registered once, resets to 1; low = whole-chip hold one edge later)</text><line x1="232" y1="200" x2="668" y2="200" stroke="#888" stroke-width="2" marker-end="url(#a)"/><text x="250" y="194" font-size="10.5" text-anchor="start" font-weight="normal" fill="#333" font-family="Helvetica,Arial,sans-serif">ui_in[7:0] = data byte</text><text x="250" y="214" font-size="9.5" text-anchor="start" font-weight="normal" fill="#777" font-family="Helvetica,Arial,sans-serif">LOAD operand: [7:4] lane 1, [3:0] lane 0 (signed 4-bit); echoed by DEBUG_INPUT</text><line x1="232" y1="250" x2="668" y2="250" stroke="#888" stroke-width="2" marker-end="url(#a)"/><text x="250" y="244" font-size="10.5" text-anchor="start" font-weight="normal" fill="#333" font-family="Helvetica,Arial,sans-serif">uio_in[7:0] = instruction</text><text x="250" y="264" font-size="9.5" text-anchor="start" font-weight="normal" fill="#777" font-family="Helvetica,Arial,sans-serif">[7:4] opcode, [3:0] arguments</text><line x1="668" y1="310" x2="232" y2="310" stroke="#888" stroke-width="2" marker-end="url(#a)"/><text x="650" y="304" font-size="10.5" text-anchor="end" font-weight="normal" fill="#333" font-family="Helvetica,Arial,sans-serif">uo_out[7:0] (live flags + data nibble)</text><text x="650" y="324" font-size="9.5" text-anchor="end" font-weight="normal" fill="#777" font-family="Helvetica,Arial,sans-serif">[7] debug busy [6] dump busy [5] illegal [4] overflow | [3:0] dump nibble, 0 when idle</text><text x="650" y="340" font-size="9.5" text-anchor="end" font-weight="normal" fill="#777" font-family="Helvetica,Arial,sans-serif">during a debug freeze, all 8 bits carry the frozen debug byte for one clock period</text><line x1="668" y1="372" x2="232" y2="372" stroke="#888" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#a)"/><text x="650" y="366" font-size="10.5" text-anchor="end" font-weight="normal" fill="#333" font-family="Helvetica,Arial,sans-serif">uio_oe[7:0] = 8'h00, uio_out = 8'h00 (bidirectional pads used as inputs only)</text></svg>